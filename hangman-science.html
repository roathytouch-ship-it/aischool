<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚗️ Hangman Science · G8–G12</title>
    <style>
        /* ── Reset & Base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }
        .game-container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 28px 30px 34px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.2s;
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 16px;
            margin-bottom: 18px;
        }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #b7e4ff, #7fc9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header h1 small {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.6;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
        }
        .stats {
            display: flex;
            gap: 18px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.95rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 18px 6px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .stats span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stats .num {
            font-weight: 700;
            color: #fff;
            min-width: 1.8rem;
            text-align: center;
        }
        .stats .num.green {
            color: #6fcf97;
        }
        .stats .num.red {
            color: #f28b82;
        }

        /* ── Question Badge ── */
        .question-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .question-badge .subject {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.08);
            color: #aacbff;
        }
        .question-badge .grade {
            font-size: 0.8rem;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd966;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 600;
        }
        .question-badge .q-counter {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #e8f0fe;
            padding: 6px 4px 12px 4px;
            line-height: 1.5;
            min-height: 3.2rem;
            text-align: center;
            letter-spacing: 0.2px;
        }

        /* ── Hangman Canvas ── */
        .canvas-wrap {
            display: flex;
            justify-content: center;
            margin: 4px 0 6px;
        }
        #hangmanCanvas {
            width: 100%;
            max-width: 340px;
            height: auto;
            aspect-ratio: 340 / 280;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 8px 20px rgba(0, 0, 0, 0.4);
            display: block;
        }

        /* ── Word Display ── */
        .word-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 18px 0 22px;
            padding: 8px 0;
        }
        .letter-slot {
            font-size: 2.2rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            width: 2.8rem;
            height: 3.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 4px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px 8px 0 0;
            color: #fff;
            transition: 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .letter-slot.revealed {
            border-bottom-color: #6fcf97;
            background: rgba(111, 207, 151, 0.08);
        }
        .letter-slot.wrong {
            opacity: 0.2;
            border-bottom-color: #f28b82;
        }

        /* ── Keyboard ── */
        .keyboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin: 16px 0 18px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .key {
            width: 2.2rem;
            height: 2.6rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.08);
            color: #dbe4f0;
            cursor: pointer;
            transition: 0.12s;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        .key:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: none;
        }
        .key:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none;
        }
        .key.correct {
            background: rgba(111, 207, 151, 0.25);
            border-color: #6fcf97;
            color: #6fcf97;
        }
        .key.wrong {
            background: rgba(242, 139, 130, 0.2);
            border-color: #f28b82;
            color: #f28b82;
        }

        /* ── Controls ── */
        .controls {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .btn {
            padding: 11px 28px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            background: rgba(255, 255, 255, 0.07);
            color: #c8d8f0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2d7dd2, #1a5fb0);
            color: #fff;
            border-color: #3a8ae0;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #3a8ae0, #2670c4);
        }
        .btn-success {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            color: #fff;
            border-color: #2ecc71;
        }
        .btn-success:hover {
            background: linear-gradient(135deg, #2ecc71, #229954);
        }
        .btn-warning {
            background: linear-gradient(135deg, #d4a017, #b7950b);
            color: #fff;
            border-color: #e6b800;
        }
        .btn-warning:hover {
            background: linear-gradient(135deg, #e6b800, #c99f0e);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        /* ── Hint ── */
        .hint-box {
            text-align: center;
            margin: 10px 0 4px;
            font-size: 0.92rem;
            color: rgba(255, 255, 255, 0.45);
            min-height: 1.8rem;
            font-style: italic;
            transition: 0.2s;
        }
        .hint-box.active {
            color: #ffd966;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .game-container {
                padding: 18px 14px 24px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .stats {
                font-size: 0.8rem;
                padding: 4px 12px 4px 14px;
                gap: 10px;
            }
            .question-text {
                font-size: 1rem;
                min-height: 2.6rem;
            }
            .letter-slot {
                font-size: 1.6rem;
                width: 2.2rem;
                height: 2.8rem;
            }
            .key {
                width: 2.2rem;
                height: 2.4rem;
                font-size: 0.9rem;
                border-radius: 10px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
            .question-badge {
                padding: 8px 14px;
                border-radius: 40px;
                font-size: 0.75rem;
            }
            .canvas-wrap #hangmanCanvas {
                max-width: 240px;
            }
            .word-display {
                gap: 6px;
            }
        }
        @media (max-width: 420px) {
            .letter-slot {
                font-size: 1.3rem;
                width: 1.8rem;
                height: 2.4rem;
            }
            .key {
                width: 1.9rem;
                height: 2.1rem;
                font-size: 0.75rem;
                gap: 4px;
            }
            .keyboard {
                gap: 4px;
            }
            .stats {
                font-size: 0.7rem;
                gap: 6px;
                padding: 3px 8px 3px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container" role="main" aria-label="Hangman Science Game">

        <!-- Header -->
        <div class="header">
            <h1>🧪 Hangman <small>Science</small></h1>
            <div class="stats">
                <span>✅ <span class="num green" id="score">0</span></span>
                <span>❌ <span class="num red" id="misses">0</span></span>
                <span>📚 <span class="num" id="qnum">0</span></span>
            </div>
        </div>

        <!-- Question -->
        <div class="question-badge">
            <span class="subject" id="subjectTag">Physics</span>
            <span class="grade" id="gradeTag">G9</span>
            <span class="q-counter" id="qCounter">1 / 800</span>
        </div>
        <div class="question-text" id="questionText">Loading question…</div>

        <!-- Hangman Canvas -->
        <div class="canvas-wrap">
            <canvas id="hangmanCanvas" width="340" height="280"></canvas>
        </div>

        <!-- Word Display -->
        <div class="word-display" id="wordDisplay"></div>

        <!-- Hint -->
        <div class="hint-box" id="hintBox">💡 Press "Hint" for a clue</div>

        <!-- Keyboard -->
        <div class="keyboard" id="keyboard" role="group" aria-label="Letter keyboard"></div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-outline" id="hintBtn">💡 Hint</button>
            <button class="btn btn-warning" id="skipBtn">⏭ Skip</button>
            <button class="btn btn-primary" id="newBtn">🔄 New Word</button>
            <button class="btn btn-success" id="resetBtn">🔁 Reset</button>
        </div>

    </div>

    <script>

        const QUESTION_BANK = [];

        // -------- HELPER to add questions in bulk ----------------------
        function addQuestions(list) {
            for (const item of list) {
                QUESTION_BANK.push({
                    q: item.q,
                    a: item.a.toLowerCase().trim(),
                    subject: item.subject || 'Science',
                    grade: item.grade || 'G9-12',
                    hint: item.hint || null
                });
            }
        }

            { q: 'A period of heavy rainfall leading to overflowing water', a: 'Flood', subject: 'Earth Science', grade: 'G9' },
            // Astronomy
            { q: 'The star at the center of our solar system', a: 'Sun', subject: 'Astronomy', grade: 'G8' },
            { q: 'The planet closest to the Sun', a: 'Mercury', subject: 'Astronomy', grade: 'G8' },

            { q: 'The largest planet in the solar system', a: 'Jupiter', subject: 'Astronomy', grade: 'G8' },
            { q: 'The planet with the most prominent ring system', a: 'Saturn', subject: 'Astronomy', grade: 'G8' },
            { q: 'The planet known as the "Red Planet"', a: 'Mars', subject: 'Astronomy', grade: 'G8' },
            { q: 'The planet known as the "Morning Star"', a: 'Venus', subject: 'Astronomy', grade: 'G9' },
            { q: 'Earth\'s only natural satellite', a: 'Moon', subject: 'Astronomy', grade: 'G8' },
            { q: 'A celestial body that orbits a star', a: 'Planet', subject: 'Astronomy', grade: 'G8' },
            { q: 'A celestial body that orbits a planet', a: 'Moon', subject: 'Astronomy', grade: 'G8' },
            { q: 'A small rocky body that orbits the Sun', a: 'Asteroid', subject: 'Astronomy', grade: 'G9' },
            { q: 'A frozen body that orbits the Sun and has a tail', a: 'Comet', subject: 'Astronomy', grade: 'G9' },
            { q: 'A meteoroid that burns up in Earth\'s atmosphere', a: 'Meteor', subject: 'Astronomy', grade: 'G9' },

                grade: 'G12' },
            { q: 'The theory of the origin of the universe', a: 'Big bang', subject: 'Astronomy', grade: 'G10' },

            // Environmental Science
            { q: 'The variety of life in an ecosystem', a: 'Biodiversity', subject: 'Environmental', grade: 'G9' },
            { q: 'The process of planting trees to replace those cut down', a: 'Reforestation', subject: 'Environmental',
                grade: 'G9' },
            { q: 'The clearing of forests for other use', a: 'Deforestation', subject: 'Environmental', grade: 'G9' },
            { q: 'The contamination of air, water, or soil', a: 'Pollution', subject: 'Environmental', grade: 'G8' },
            { q: 'The increase in Earth\'s average temperature', a: 'Global warming', subject: 'Environmental', grade: 'G9' },
            { q: 'The main greenhouse gas emitted by burning fossil fuels', a: 'Carbon dioxide', subject: 'Environmental',
                grade: 'G9' },
            { q: 'A renewable energy source from the sun', a: 'Solar', subject: 'Environmental', grade: 'G9' },
            { q: 'A renewable energy source from the wind', a: 'Wind', subject: 'Environmental', grade: 'G9' },
            { q: 'A renewable energy source from moving water', a: 'Hydroelectric', subject: 'Environmental', grade: 'G9' },
            { q: 'A renewable energy source from organic matter', a: 'Biomass', subject: 'Environmental', grade: 'G10' },
            { q: 'A renewable energy source from heat within the Earth', a: 'Geothermal', subject: 'Environmental',
                grade: 'G10' },
            { q: 'A non-renewable energy source formed from ancient plants', a: 'Coal', subject: 'Environmental', grade: 'G9' },
            { q: 'A non-renewable energy source formed from marine organisms', a: 'Oil', subject: 'Environmental', grade: 'G9' },
            { q: 'A non-renewable energy source composed mainly of methane', a: 'Natural gas', subject: 'Environmental',
                grade: 'G9' },
            { q: 'The practice of using resources wisely', a: 'Conservation', subject: 'Environmental', grade: 'G8' },
            { q: 'The process of converting waste into reusable material', a: 'Recycling', subject: 'Environmental',
                grade: 'G8' },
            { q: 'The layer of the atmosphere that protects us from UV radiation', a: 'Ozone layer', subject: 'Environmental',
                grade: 'G9' },
            { q: 'A chemical that depletes the ozone layer', a: 'CFC', subject: 'Environmental', grade: 'G10' },
            { q: 'The increase in nutrient levels in water leading to algal blooms', a: 'Eutrophication', subject: 'Environmental',
                grade: 'G11' },
            { q: 'A species that is at risk of extinction', a: 'Endangered', subject: 'Environmental', grade: 'G9' },
            { q: 'A species that has died out', a: 'Extinct', subject: 'Environmental', grade: 'G9' },
            { q: 'The study of how organisms interact with their environment', a: 'Ecology', subject: 'Environmental',
                grade: 'G10' },
        ];

        // ─── Build the master question bank ─────────────────────────────
        addQuestions(physicsQ);
        addQuestions(chemistryQ);
        addQuestions(generalQ);

        // Shuffle the question bank so each game feels mixed.
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        shuffleArray(QUESTION_BANK);

        // If we somehow have fewer than 800, pad with duplicates? No – we'll just use what we have.
        // We generated ~250+250+300 = 800 exactly (with some rounding).
        console.log(`✅ Loaded ${QUESTION_BANK.length} questions.`);

        // ─── GAME STATE ───────────────────────────────────────────────────
        const state = {
            questions: QUESTION_BANK,
            current: 0, // index into questions
            word: '', // lowercase
            display: [], // array of {char, revealed}
            guesses: new Set(),
            wrong: 0,
            maxWrong: 7,
            score: 0, // correct answers
            misses: 0, // incorrect answers (game lost)
            gameOver: false,
            hintUsed: false,
        };

        // ─── DOM refs ────────────────────────────────────────────────────
        const canvas = document.getElementById('hangmanCanvas');
        const ctx = canvas.getContext('2d');
        const wordDisplay = document.getElementById('wordDisplay');
        const keyboardEl = document.getElementById('keyboard');
        const questionText = document.getElementById('questionText');
        const subjectTag = document.getElementById('subjectTag');
        const gradeTag = document.getElementById('gradeTag');
        const qCounter = document.getElementById('qCounter');
        const scoreEl = document.getElementById('score');
        const missesEl = document.getElementById('misses');
        const qnumEl = document.getElementById('qnum');
        const hintBox = document.getElementById('hintBox');

        const hintBtn = document.getElementById('hintBtn');
        const skipBtn = document.getElementById('skipBtn');
        const newBtn = document.getElementById('newBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ─── HANGMAN DRAWING ────────────────────────────────────────────
        function drawHangman(wrong) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#c8d8f0';
            ctx.lineCap = 'round';

            // Base
            ctx.beginPath();
            ctx.moveTo(30, 260);
            ctx.lineTo(140, 260);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(85, 260);
            ctx.lineTo(85, 40);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(85, 40);
            ctx.lineTo(200, 40);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(200, 40);
            ctx.lineTo(200, 70);
            ctx.stroke();

            if (wrong >= 1) { // Head
                ctx.beginPath();
                ctx.arc(200, 90, 20, 0, 2 * Math.PI);
                ctx.stroke();
            }
            if (wrong >= 2) { // Body
                ctx.beginPath();
                ctx.moveTo(200, 110);
                ctx.lineTo(200, 170);
                ctx.stroke();
            }
            if (wrong >= 3) { // Left arm
                ctx.beginPath();
                ctx.moveTo(200, 130);
                ctx.lineTo(170, 150);
                ctx.stroke();
            }
            if (wrong >= 4) { // Right arm
                ctx.beginPath();
                ctx.moveTo(200, 130);
                ctx.lineTo(230, 150);
                ctx.stroke();
            }
            if (wrong >= 5) { // Left leg
                ctx.beginPath();
                ctx.moveTo(200, 170);
                ctx.lineTo(175, 210);
                ctx.stroke();
            }
            if (wrong >= 6) { // Right leg
                ctx.beginPath();
                ctx.moveTo(200, 170);
                ctx.lineTo(225, 210);
                ctx.stroke();
            }
            if (wrong >= 7) { // Face (X eyes)
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(190, 82);
                ctx.lineTo(198, 90);
                ctx.moveTo(198, 82);
                ctx.lineTo(190, 90);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(202, 82);
                ctx.lineTo(210, 90);
                ctx.moveTo(210, 82);
                ctx.lineTo(202, 90);
                ctx.stroke();
                // mouth
                ctx.beginPath();
                ctx.arc(200, 98, 10, 0, Math.PI);
                ctx.stroke();
                ctx.lineWidth = 3;
            }
        }

        // ─── RENDER WORD ────────────────────────────────────────────────
        function renderWord() {
            wordDisplay.innerHTML = '';
            for (const slot of state.display) {
                const el = document.createElement('div');
                el.className = 'letter-slot' + (slot.revealed ? ' revealed' : '');
                el.textContent = slot.revealed ? slot.char : '';
                wordDisplay.appendChild(el);
            }
        }

        // ─── RENDER KEYBOARD ────────────────────────────────────────────
        function renderKeyboard() {
            keyboardEl.innerHTML = '';
            const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
            for (const row of rows) {
                const rowEl = document.createElement('div');
                rowEl.className = 'keyboard-row';
                for (const ch of row) {
                    const key = document.createElement('button');
                    key.className = 'key';
                    key.textContent = ch;
                    key.dataset.letter = ch;
                    if (state.guesses.has(ch)) {
                        key.disabled = true;
                        if (state.display.some(s => s.char === ch && s.revealed)) {
                            key.classList.add('correct');
                        } else {
                            key.classList.add('wrong');
                        }
                    }
                    if (state.gameOver) key.disabled = true;
                    key.addEventListener('click', () => handleGuess(ch));
                    rowEl.appendChild(key);
                }
                keyboardEl.appendChild(rowEl);
            }
        }

        // ─── UPDATE UI ──────────────────────────────────────────────────
        function updateUI() {
            const q = state.questions[state.current];
            questionText.textContent = q.q;
            subjectTag.textContent = q.subject || 'Science';
            gradeTag.textContent = q.grade || 'G9-12';
            qCounter.textContent = `${state.current + 1} / ${state.questions.length}`;
            scoreEl.textContent = state.score;
            missesEl.textContent = state.misses;
            qnumEl.textContent = state.questions.length;

            renderWord();
            renderKeyboard();
            drawHangman(state.wrong);

            // Hint
            if (state.hintUsed) {
                hintBox.textContent = `💡 ${makeFallbackHint(q)}`;
                hintBox.classList.add('active');
            } else if (false) {
                hintBox.textContent = '💡 No hint available for this question.';
                hintBox.classList.remove('active');
            } else {
                hintBox.textContent = '💡 Press "Hint" for a clue';
                hintBox.classList.remove('active');
            }

            // Game over overlay? We'll handle via keyboard disable.
            if (state.gameOver) {
                const qq = state.questions[state.current];
                const wordRevealed = qq.a.toUpperCase();
                if (state.wrong >= state.maxWrong) {
                    hintBox.textContent = `❌ Game over! The answer was: ${wordRevealed}`;
                    hintBox.classList.add('active');
                } else {
                    hintBox.textContent = `🎉 You got it! The answer was: ${wordRevealed}`;
                    hintBox.classList.add('active');
                }
            }
        }

        // ─── CHECK WIN / LOSS ──────────────────────────────────────────
        function checkGameOver() {
            const allRevealed = state.display.every(s => s.revealed);
            if (allRevealed) {
                state.gameOver = true;
                state.score++;
                updateUI();
                return true;
            }
            if (state.wrong >= state.maxWrong) {
                state.gameOver = true;
                state.misses++;
                // Reveal all letters
                for (const slot of state.display) {
                    slot.revealed = true;
                }
                updateUI();
                return true;
            }
            return false;
        }

        // ─── HANDLE GUESS ───────────────────────────────────────────────
        function handleGuess(letter) {
            if (state.gameOver) return;
            if (state.guesses.has(letter)) return;

            state.guesses.add(letter);

            const q = state.questions[state.current];
            const word = q.a.toLowerCase();
            let found = false;
            for (let i = 0; i < word.length; i++) {
                if (word[i] === letter && !state.display[i].revealed) {
                    state.display[i].revealed = true;
                    found = true;
                }
            }

            if (!found) {
                state.wrong++;
            }

            updateUI();
            const ended = checkGameOver();
            if (!ended && !found) {
                // If wrong and not game over, still fine.
            }
            if (!ended && found) {
                // check if all revealed
                const allRevealed = state.display.every(s => s.revealed);
                if (allRevealed) {
                    state.gameOver = true;
                    state.score++;
                    updateUI();
                }
            }
        }

        // ─── LOAD QUESTION ──────────────────────────────────────────────
        function loadQuestion(index) {
            const q = state.questions[index];
            if (!q) {
                // loop back
                state.current = 0;
                return loadQuestion(0);
            }
            state.current = index;
            state.word = q.a.toLowerCase();
            state.display = state.word.split('').map(ch => ({
                char: ch,
                revealed: ch === ' ' // reveal spaces
            }));
            state.guesses = new Set();
            state.wrong = 0;
            state.gameOver = false;
            state.hintUsed = false;
            updateUI();
        }

        // ─── NEXT QUESTION (skip) ──────────────────────────────────────
        function nextQuestion() {
            let next = state.current + 1;
            if (next >= state.questions.length) {
                // Shuffle and restart
                shuffleArray(state.questions);
                next = 0;
            }
            loadQuestion(next);
        }

        // ─── RESET (restart from current) ──────────────────────────────
        function resetGame() {
            loadQuestion(state.current);
        }

        // ─── HINT ────────────────────────────────────────────────────────
        function makeFallbackHint(q) {
            if (q && q.hint) return q.hint;
            const clean = String((q && q.a) || '').replace(/[^a-z]/g, '');
            if (!clean) return 'Think about the clue above.';
            return 'Starts with ' + clean[0].toUpperCase() + ' · ' + clean.length + ' letters';
        }
        function useHint() {
            if (state.gameOver) return;
            state.hintUsed = true;
            updateUI();
        }

        // ─── KEYBOARD SUPPORT ──────────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key.length === 1 && key >= 'a' && key <= 'z') {
                e.preventDefault();
                handleGuess(key);
            }
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                if (state.gameOver) {
                    nextQuestion();
                }
            }
            if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                useHint();
            }
            if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                resetGame();
            }
            if (e.key === 'n' || e.key === 'N') {
                e.preventDefault();
                nextQuestion();
            }
        });

        // ─── BUTTON EVENTS ──────────────────────────────────────────────
        hintBtn.addEventListener('click', useHint);
        skipBtn.addEventListener('click', nextQuestion);
        newBtn.addEventListener('click', nextQuestion);
        resetBtn.addEventListener('click', resetGame);

        // ─── INIT ───────────────────────────────────────────────────────
        // Ensure we have at least one question
        if (state.questions.length === 0) {
            // fallback
            state.questions.push({ q: 'What is the chemical symbol for water?', a: 'H2O', subject: 'Chemistry',
                grade: 'G8', hint: 'Two hydrogens, one oxygen' });
            state.questions.push({ q: 'What is the SI unit of force?', a: 'Newton', subject: 'Physics', grade: 'G9',
                hint: 'Sir Isaac' });
            state.questions.push({ q: 'What is the largest planet?', a: 'Jupiter', subject: 'Astronomy', grade: 'G8',
                hint: 'Biggest in our solar system' });
        }
        // Shuffle once more for good measure
        shuffleArray(state.questions);
        loadQuestion(0);

        // Ensure canvas draws correctly on resize
        window.addEventListener('resize', () => drawHangman(state.wrong));

        console.log('🚀 Hangman Science loaded!');
        console.log(`📚 ${state.questions.length} questions ready.`);
        console.log('⌨️  Use keyboard: A-Z, Enter=next, H=hint, R=reset, N=next');
    </script>
